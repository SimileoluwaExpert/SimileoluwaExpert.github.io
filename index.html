<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olubits Tech | Software & IT Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
            text-decoration: none;
        }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 0 8%;
            max-width: 1000px;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #f8fafc;
        }

        .hero h2 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .hero p {
            font-size: 1.1rem;
            color: #94a3b8;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            border-top: 1px solid #334155;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Olubits Tech</a>
        <nav>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main class="hero" id="about">
        <h1>Olubits Tech</h1>
        <h2>Software Engineering &amp; IT Consultancy</h2>
        <p>Building reliable software solutions, enterprise systems, and custom applications designed to power business operations efficiently.</p>
        <a href="mailto:contact@olubitstech.me" class="btn" id="contact">Get In Touch</a>
    </main>

    <footer>
        <p>&copy; 2026 Olubits Tech. All rights reserved.</p>
    </footer>

</body>
</html>
